{% extends 'base.html' %}

{% block title %}Edit "{{ encounter['name'] }}"{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h1 class="h3 card-title mb-3">Edit Encounter</h1>
          <form method="post">
            <div class="mb-3">
              <label for="name" class="form-label">Name</label>
              <input type="text" class="form-control" name="name" id="name"
                     value="{{ request.form['name'] or encounter['name'] }}" required>
            </div>
            <div class="mb-3">
              <label for="description" class="form-label">Description <span class="text-body-secondary">(optional)</span></label>
              <textarea class="form-control" name="description" id="description"
                        rows="4">{{ request.form['description'] or encounter['description'] or '' }}</textarea>
            </div>
            <div class="d-flex justify-content-between">
              <button type="button" class="btn btn-outline-danger" data-bs-toggle="modal" data-bs-target="#deleteModal">
                Delete Encounter
              </button>
              <div class="d-flex gap-2">
                <a class="btn btn-outline-secondary" href="{{ url_for('encounters.detail', id=encounter['id']) }}">Cancel</a>
                <button type="submit" class="btn btn-primary">Save</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="deleteModalLabel">Delete Encounter</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          Delete <strong>{{ encounter['name'] }}</strong>? This will also remove all of its combatants.
          This cannot be undone.
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <form action="{{ url_for('encounters.delete', id=encounter['id']) }}" method="post">
            <button type="submit" class="btn btn-danger">Delete</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
