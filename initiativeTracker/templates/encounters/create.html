{% extends 'base.html' %}

{% block title %}New Encounter{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h1 class="h3 card-title mb-3">New Encounter</h1>
          <form method="post">
            <div class="mb-3">
              <label for="name" class="form-label">Name</label>
              <input type="text" class="form-control" name="name" id="name"
                     value="{{ request.form['name'] }}" placeholder="Goblin Ambush at the Bridge" maxlength="100" required>
            </div>
            <div class="mb-3">
              <label for="description" class="form-label">Description <span class="text-body-secondary">(optional)</span></label>
              <textarea class="form-control" name="description" id="description" rows="4" maxlength="1000"
                        placeholder="Setting, goals, or notes for this fight">{{ request.form['description'] }}</textarea>
            </div>
            <div class="d-flex justify-content-end gap-2">
              <a class="btn btn-outline-secondary" href="{{ url_for('encounters.index') }}">Cancel</a>
              <button type="submit" class="btn btn-primary">Create Encounter</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
